# BILD-VERGLEICH (Tim, 25.08.2026): Zeigt fuer einzelne Artikel, welches
# Bild die Website heute hat und welches offizielle Herstellermaterial
# stattdessen dort stuende. Aendert nichts, postet nichts, committet nichts.
name: Bild-Vergleich

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Artikel-Adressen oder Slugs, durch Leerzeichen getrennt"
        required: true

jobs:
  vergleich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Dependencies installieren
        run: npm ci
      - name: Vergleich
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          VERGLEICH_SLUGS: ${{ inputs.slugs }}
        run: node pipeline/bild-vergleich.mjs
      - name: Bilder anhaengen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bild-vergleich
          path: vergleich/
          if-no-files-found: warn
