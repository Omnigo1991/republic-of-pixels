# Fortlaufende News-Pipeline: Prüfung der RSS-Feeds alle 3 Stunden,
# Veröffentlichung sobald relevante neue Meldungen da sind (max. 2 Artikel pro
# Lauf). Der Push löst automatisch das Vercel-Production-Deployment aus.
# Manueller Start: GitHub → Actions → "News-Pipeline" → "Run workflow".
# Takt-Entscheidung 07.08.2026: von stündlich auf alle 3 Std. reduziert —
# ~30 Artikel/Tag verdrängten Beiträge nach ~8 Std. von der sichtbaren
# "Alle News"-Liste; Leser kamen nicht nach. Ziel: ~10-14 Artikel/Tag.
name: News-Pipeline

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Maximale Artikel in diesem Lauf"
        default: "2"
        required: false

concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Pipeline ausführen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_ARTICLES_PER_RUN: ${{ github.event.inputs.max_articles || '2' }}
        run: node pipeline/run.mjs

      - name: Deal-Radar aktualisieren (Steam-Angebote)
        # Schreibt src/content/deals.json nur bei inhaltlicher Änderung —
        # unveränderte Deals lösen keinen Commit/Deploy aus.
        run: node pipeline/deals.mjs

      - name: Neue Artikel oder Deals erkennen
        id: changes
        run: |
          if git status --porcelain src/content/articles src/content/deals.json | grep -q .; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Keine neuen Artikel oder Deals — Build und Deployment entfallen."
          fi

      - name: Build-Prüfung (nichts Kaputtes veröffentlichen)
        if: steps.changes.outputs.new == 'true'
        env:
          # Öffentliche Werte (landen ohnehin im Browser-Bundle) — nötig,
          # damit der Prerender der Community-Komponenten durchläuft.
          NEXT_PUBLIC_SUPABASE_URL: https://yvsrquekxnumvmgmjfpy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_hYuXxyx4p_uMMKLFpUu2JQ_lE2mlREG
        run: npm run build

      - name: Änderungen committen und pushen
        if: steps.changes.outputs.new == 'true'
        run: |
          git config user.name "RoP News-Pipeline"
          git config user.email "actions@github.com"
          # articles.generated.ts wird vom prebuild-Schritt neu erzeugt und muss
          # mit committet werden, sonst blockiert die Änderung den Rebase.
          # Der Bilder-Ordner existiert nur, wenn mindestens ein Bild geladen wurde.
          git add src/content/articles src/content/deals.json pipeline/state.json src/lib/articles.generated.ts
          if [ -d public/images/articles ]; then git add public/images/articles; fi
          if git diff --cached --quiet; then
            echo "Keine neuen Artikel oder Deals in diesem Lauf."
            exit 0
          fi
          COUNT=$(git diff --cached --name-only -- src/content/articles | wc -l | tr -d ' ')
          if [ "$COUNT" = "0" ]; then
            git commit -m "Deal-Radar aktualisiert ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          else
            git commit -m "Auto-Publish: ${COUNT} neue Artikel ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          fi
          git pull --rebase --autostash origin main
          git push origin main
