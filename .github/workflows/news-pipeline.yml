# Fortlaufende News-Pipeline: Prüfung der RSS-Feeds alle 4 Stunden,
# Veröffentlichung sobald relevante neue Meldungen da sind. Der Push löst
# automatisch das Vercel-Production-Deployment aus.
#
# WIE VIEL ERSCHEINT, ENTSCHEIDET SEIT DEM 27.08.2026 NICHT MEHR DIESER
# ZEITPLAN, sondern pipeline/lib/takt.mjs: ein Tagesbudget von 20 Artikeln,
# über den Tag verteilt freigegeben. Vorher hing die Tagesmenge daran, wie oft
# GitHub den Lauf tatsächlich startete - gemessen waren das zehn Bündel am Tag
# statt der sechs, die dieser Zeitplan vorsieht, und niemand konnte erklären,
# woher die vier zusätzlichen kamen. Die Tagesmenge ist damit jetzt eine
# Entscheidung und keine Nebenwirkung der Zeitplanung mehr.
#
# DESHALB STEHT DIE OBERGRENZE PRO LAUF JETZT AUF 4 UND NICHT MEHR AUF 2. Das
# ist keine Erhöhung der Menge, sondern ihre Absicherung: Ein Lauf darf
# nachholen, wenn er hinter der Tageskurve liegt. Durchgerechnet ergibt das
# bei zehn Läufen 19 Artikel, bei sechs 18 und bei vier immer noch 16 - vorher
# wären es bei sechs Läufen nur 11 gewesen. Die Menge hängt jetzt am Budget,
# nicht an GitHubs Launen.
#
# EILMELDUNGEN LAUFEN GETRENNT (.github/workflows/eilmeldung.yml, alle 30
# Minuten). Dieser Workflow hier bleibt bewusst beim Vier-Stunden-Takt, weil
# an ihm auch Instagram, Deals, Charts und das Pixel-Rätsel hängen - siehe die
# Begründung zum Zeitplan weiter unten.
# Manueller Start: GitHub → Actions → "News-Pipeline" → "Run workflow".
# Takt-Entscheidung 07.08.2026: von stündlich auf alle 3 Std. reduziert -
# ~30 Artikel/Tag verdrängten Beiträge nach ~8 Std. von der sichtbaren
# "Alle News"-Liste; Leser kamen nicht nach. Ziel: ~10-14 Artikel/Tag.
# Takt-Entscheidung 23.08.2026 (Tim, wegen der API-Kosten): alle 4 Std.,
# also 6 statt 8 Läufe am Tag. Der Startpunkt 02:23 UTC ist bewusst
# gewählt und darf nicht auf "*/4" vereinfacht werden: GitHub rechnet in
# UTC, unser Instagram-Fenster in Zürcher Zeit. Nur mit diesem Versatz
# fallen in beiden Zeitzonen - Sommer wie Winter - drei Läufe so ins
# Fenster 9-21 Uhr, dass die Tageskurve ihre 5 Posts erreicht. Mit
# "*/4" wären es nur 4 Posts pro Tag (durchgerechnet 23.08.2026).
# Die Minute 05 ist ebenfalls Absicht: GitHub startet geplante Läufe
# nachweislich 17 bis 101 Minuten zu spät (gemessen an den letzten
# sechs Läufen am 22./23.08.2026). Je früher in der Stunde wir
# einsteigen, desto mehr Verspätung verträgt der letzte Lauf im
# Instagram-Fenster, bevor er hinten hinausfällt.
name: News-Pipeline

on:
  schedule:
    - cron: "5 2-23/4 * * *"
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Maximale Artikel in diesem Lauf (Obergrenze; die Tageskurve begrenzt zusätzlich)"
        default: "4"
        required: false
      manual_urls:
        description: "Manueller Nachzug: Quell-URLs (durch Leerzeichen oder Komma getrennt) statt Feeds"
        default: ""
        required: false

concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # 40 statt 30: Die Instagram-Publish-Phase wartet bis zu 6 Min. pro Post
    # auf das Vercel-Deployment der Grafik.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # FRISCH AUF DIE SPITZE (15.08.2026): Ein Lauf, der in der
      # Warteschlange wartete, wuerde sonst auf dem Repository-Stand von
      # seinem STARTZEITPUNKT arbeiten — der Lauf davor hat aber gepusht.
      # Folge am 15.08.: Der aufgestaute Lauf erzeugte bereits
      # veroeffentlichte Artikel erneut und scheiterte am Merge-Konflikt.
      - name: Auf aktuellen Stand ziehen
        run: git pull --ff-only origin main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      # Chromium für den Instagram-Grafik-Renderer. Playwright wird bewusst
      # NUR hier installiert (--no-save, nicht in package.json): als normale
      # Dependency würde sein Postinstall bei jedem Vercel-Deploy ~120 MB
      # Browser herunterladen und alle Deploys ausbremsen.
      - name: Playwright-Browser cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Playwright und ffmpeg bereitstellen
        # Beide bewusst --no-save (nicht in package.json): Playwrights und
        # ffmpeg-statics Postinstall-Downloads würden sonst jeden
        # Vercel-Deploy ausbremsen. ffmpeg-static liefert das Binary für
        # den Reel-Renderer.
        run: |
          npm install --no-save playwright ffmpeg-static
          npx playwright install --with-deps chromium

      - name: Pipeline ausführen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_ARTICLES_PER_RUN: ${{ github.event.inputs.max_articles || '4' }}
          MANUAL_URLS: ${{ github.event.inputs.manual_urls || '' }}
          # Fuer die Story-Radar-Warteschlange. Der Anon-Schluessel ist
          # oeffentlich (er steckt ohnehin im Browser-Buendel); fehlen die
          # Werte, werden Auftraege einfach uebersprungen.
          SUPABASE_URL: https://yvsrquekxnumvmgmjfpy.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_hYuXxyx4p_uMMKLFpUu2JQ_lE2mlREG
        run: node pipeline/run.mjs

      - name: Deal-Radar aktualisieren (Steam-Angebote)
        # Schreibt src/content/deals.json nur bei inhaltlicher Änderung —
        # unveränderte Deals lösen keinen Commit/Deploy aus.
        run: node pipeline/deals.mjs

      - name: Charts-Radar aktualisieren (Steam-Wochencharts)
        # Schreibt src/content/charts.json nur montags (bzw. wenn die Datei
        # fehlt oder älter als 8 Tage ist) — Wochen-Charts, kein Dauerlauf.
        run: node pipeline/charts.mjs

      - name: Event-Wächter (bestätigte Termine melden)
        # Meldet, wenn Quellen einen Termin bestätigen, der bei uns noch als
        # "erwartet" oder "Gerücht" steht. Aendert NICHTS an events.json —
        # ein Datum aus einer Schlagzeile zu lesen ist unzuverlaessig, ein
        # falsches Datum bei einem Grossereignis waere peinlicher als ein
        # fehlender Eintrag. Der Mensch entscheidet, der Waechter sorgt nur
        # dafuer, dass es niemand uebersieht.
        run: node pipeline/eventwaechter.mjs || true

      - name: Countdown-Wache (Terminvorrat prüfen)
        # Schaut voraus, wie lange der Vorrat an bestätigten Terminen noch
        # reicht, und meldet es, BEVOR der Countdown auf der Startseite leer
        # wird. Zweimal ist er verschwunden (25. und 29.08.2026), zweimal hat
        # es Tim gefunden und kein Waechter. Ein fehlender Termin darf das
        # Veroeffentlichen von Nachrichten nicht stoppen, deshalb "|| true".
        run: node pipeline/countdown-wache.mjs || true

      - name: Server-Status prüfen (Störungs-Wächter)
        # Fragt die offiziellen Statusquellen ab und erkennt NEUE Störungen.
        # Der Radar ist als Leser-Feature schwach (Downdetector besetzt diese
        # Suchanfragen), als Artikel-Auslöser aber stark: Wir sind eine
        # Nachrichtenseite, und eine Störung binnen Minuten zu melden ist
        # genau unser Geschwindigkeitsvorteil. Ein Fehler hier darf den Lauf
        # nicht abbrechen — Nachrichten sind wichtiger als der Status.
        run: node pipeline/serverstatus.mjs || true

      - name: Pixel-Raten erzeugen (tägliches Rätsel)
        # Erzeugt einmal pro Tag (Europe/Zurich) das Rätsel samt fünf
        # Schärfe-Stufen-Bildern; existiert das heutige schon, tut der
        # Schritt nichts. Braucht die Twitch-Secrets für IGDB-Artwork.
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node pipeline/pixelraten.mjs

      - name: Instagram-Posts vorbereiten (Auswahl, Texte, Grafiken)
        # Phase 1 des Autopostings: schreibt Grafiken nach public/social/
        # (werden mit committet und von Vercel gehostet) und die Publish-
        # Aufträge nach .ig-queue.json (gitignored, nur für Phase 2 unten).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # IGDB-Zugang (Konsolen-Artwork, 09.08.2026) — ohne die Secrets
          # wird die IGDB-Stufe einfach übersprungen.
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node pipeline/instagram.mjs prepare

      - name: Neue Artikel oder Deals erkennen
        id: changes
        run: |
          if git status --porcelain src/content/articles src/content/deals.json src/content/charts.json src/content/pixelraten.json public/social public/images/pixelraten | grep -q .; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Keine neuen Artikel oder Deals — Build und Deployment entfallen."
          fi

      - name: Build-Prüfung (nichts Kaputtes veröffentlichen)
        if: steps.changes.outputs.new == 'true'
        env:
          # Öffentliche Werte (landen ohnehin im Browser-Bundle) — nötig,
          # damit der Prerender der Community-Komponenten durchläuft.
          NEXT_PUBLIC_SUPABASE_URL: https://yvsrquekxnumvmgmjfpy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_hYuXxyx4p_uMMKLFpUu2JQ_lE2mlREG
        run: npm run build

      - name: Änderungen committen und pushen
        if: steps.changes.outputs.new == 'true'
        run: |
          git config user.name "RoP News-Pipeline"
          git config user.email "actions@github.com"
          # articles.generated.ts wird vom prebuild-Schritt neu erzeugt und muss
          # mit committet werden, sonst blockiert die Änderung den Rebase.
          # Der Bilder-Ordner existiert nur, wenn mindestens ein Bild geladen wurde.
          git add src/content/articles src/content/deals.json src/content/charts.json src/content/pixelraten.json pipeline/state.json src/lib/articles.generated.ts
          if [ -d public/images/pixelraten ]; then git add public/images/pixelraten; fi
          if [ -d public/images/articles ]; then git add public/images/articles; fi
          if [ -d public/social ]; then git add public/social; fi
          if git diff --cached --quiet; then
            echo "Keine neuen Artikel oder Deals in diesem Lauf."
            exit 0
          fi
          COUNT=$(git diff --cached --name-only -- src/content/articles | wc -l | tr -d ' ')
          if [ "$COUNT" = "0" ]; then
            git commit -m "Deal-Radar aktualisiert ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          else
            git commit -m "Auto-Publish: ${COUNT} neue Artikel ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          fi
          git pull --rebase --autostash origin main
          git push origin main

      - name: Instagram-Posts veröffentlichen
        # Phase 2: wartet, bis Vercel die Grafiken ausliefert, und publiziert
        # dann über die Instagram-API. Läuft nach dem Push; ein Fehlschlag
        # hier bricht den Workflow nicht ab (Skript loggt nur).
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node pipeline/instagram.mjs publish

      - name: Fehlgeschlagene Posts entsperren (Slots zurückgeben)
        # Publish-Fehler ("API access blocked", Deploy-Timeout …) dürfen
        # keine Tages-Slots verbrennen: ig-unmark.mjs nimmt die optimistische
        # Markierung zurück, ein späterer Lauf versucht die Story erneut.
        # if: always() — läuft auch, wenn der Publish-Schritt den Lauf rot
        # gefärbt hat (Sofort-Alarm per GitHub-Mail).
        if: always()
        run: |
          node pipeline/ig-unmark.mjs
          if ! git diff --quiet pipeline/state.json; then
            git config user.name "RoP News-Pipeline"
            git config user.email "actions@github.com"
            git add pipeline/state.json
            git commit -m "IG: fehlgeschlagene Posts entsperrt (Slots zurückgegeben)"
            git pull --rebase --autostash origin main
            git push origin main
          fi
