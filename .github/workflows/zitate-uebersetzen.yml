# Einmal-Migration: fremdsprachige Zitate in Bestandsartikeln ins Deutsche
# übersetzen (Tim-Vorgabe 08.08.2026). Manueller Start:
# GitHub → Actions → "Zitate übersetzen" → Run workflow.
# Idempotent — deutsche Zitate bleiben unangetastet, mehrfaches Ausführen
# ist harmlos.
name: Zitate übersetzen

on:
  workflow_dispatch:

concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  uebersetzen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # FRISCH AUF DIE SPITZE (15.08.2026): Ein Lauf, der in der
      # Warteschlange wartete, wuerde sonst auf dem Repository-Stand von
      # seinem STARTZEITPUNKT arbeiten — der Lauf davor hat aber gepusht.
      # Folge am 15.08.: Der aufgestaute Lauf erzeugte bereits
      # veroeffentlichte Artikel erneut und scheiterte am Merge-Konflikt.
      - name: Auf aktuellen Stand ziehen
        run: git pull --ff-only origin main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Zitate übersetzen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node pipeline/zitate-uebersetzen.mjs

      - name: Änderungen committen und pushen
        run: |
          git config user.name "RoP News-Pipeline"
          git config user.email "actions@github.com"
          npm run prebuild
          git add src/content/articles src/lib/articles.generated.ts
          if git diff --cached --quiet; then
            echo "Keine Zitate zu übersetzen."
            exit 0
          fi
          COUNT=$(git diff --cached --name-only -- src/content/articles | wc -l | tr -d ' ')
          git commit -m "Zitate ins Deutsche übersetzt (${COUNT} Artikel)"
          git pull --rebase --autostash origin main
          git push origin main
