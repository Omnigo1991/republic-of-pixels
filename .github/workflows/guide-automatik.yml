# GUIDE-AUTOMATIK (Tim, 27.08.2026: "Bau Welle 1 so um und beginne").
#
# DER BEFUND: In 23 Tagen sind 375 News entstanden und 2 Guides. Der Grund war
# nicht Können, sondern ein fehlender Zeitplan - die News-Pipeline hatte eine
# Uhr, die Guide-Werkstatt liess sich nur von Hand starten.
#
# Und der Unterschied im Ertrag ist gross. Aus der Google Search Console vom
# 27.08.2026, 3 Monate:
#   WoW Patch 12.1 (Patchnotes)   272 Impressionen, 11 Klicks
#   Guide Stalker 2                67 Impressionen,  3 Klicks
#   Durchschnitt aller Artikel      6,7 Impressionen, 0,15 Klicks
# Eine Nachricht wird zwei Tage gesucht und stirbt. Eine Übersicht wächst.
#
# WAS HIER ENTSTEHT: Übersichtsseiten zu Spielen, über die wir selbst schon
# mindestens viermal berichtet haben, gebaut aus den Originalquellen unserer
# eigenen Artikel. Keine Spiel-Tutorials - warum das aus Nachrichtenquellen
# grundsätzlich nicht geht, steht in pipeline/guide-planer.mjs.
#
# EINMAL AM TAG, UM 09:20 UTC. Bewusst nicht zur vollen Stunde und bewusst
# nicht zu den Zeiten der News-Pipeline (02/06/10/14/18/22 nach 5), damit sich
# die beiden beim Push nicht ins Gehege kommen. Zur Sicherheit teilen sie sich
# zusätzlich die Nebenläufigkeitsgruppe.
#
# NICHTS AN DER OPTIK (Tim, 27.08.2026: "Ich will noch keinen separaten Reiter
# oder Button dafür"). Ein Guide ist technisch ein normaler Artikel mit
# category "guides". Es entsteht kein Menüpunkt, keine neue Seite, kein Knopf.
# Die Leser dieser Seiten kommen aus der Suche direkt auf den Artikel.
#
# PROBELAUF OHNE VERÖFFENTLICHUNG: Actions → "Guide-Automatik" → Run workflow
# → veroeffentlichen = nein. Dann landet der Entwurf nur als Download am Lauf.
name: Guide-Automatik

on:
  schedule:
    - cron: "20 9 * * *"
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: "Direkt veroeffentlichen? (ja/nein)"
        default: "ja"
        required: false

permissions:
  contents: write

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Auf aktuellen Stand ziehen
        run: git pull --ff-only origin main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      # Entscheidet, worüber geschrieben wird und woraus. Gibt "gefunden=false"
      # zurück, wenn kein Thema reif ist - dann endet der Lauf hier.
      - name: Thema und Quellen bestimmen
        id: plan
        run: node pipeline/guide-planer.mjs

      - name: Übersicht der Lage protokollieren
        run: node pipeline/guide-planer.mjs --liste

      # Die bestehende Guide-Werkstatt, unverändert. Sie bringt ihre eigenen
      # Wächter mit: Umlaut-Prüfung, Faktentreue-Tor gegen die Quelltexte und
      # validateArticle. Scheitert das Faktentor, wird nichts veröffentlicht.
      # continue-on-error: Ein Faktentor-Veto ist kein Defekt, sondern der
      # Schutz bei der Arbeit - das Modell hat etwas geschrieben, das die
      # Quellen nicht hergeben, und wir veröffentlichen es nicht. Das darf
      # nicht jeden Tag einen roten Lauf und eine Alarm-Mail erzeugen. Der
      # ::error::-Vermerk bleibt in der Zusammenfassung sichtbar, und der
      # Schritt "Neuen Guide erkennen" sagt ausdrücklich, dass nichts
      # entstanden ist.
      - name: Guide schreiben
        continue-on-error: true
        if: steps.plan.outputs.gefunden == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GUIDE_THEMA: ${{ steps.plan.outputs.thema }}
          GUIDE_QUELLEN: ${{ steps.plan.outputs.quellen }}
          GUIDE_VEROEFFENTLICHEN: ${{ github.event.inputs.veroeffentlichen || 'ja' }}
        run: node pipeline/guide-entwurf.mjs

      # Der Entwurf hängt in jedem Fall am Lauf - auch wenn nicht
      # veröffentlicht wurde oder das Faktentor angeschlagen hat.
      - name: Entwurf als Download anhängen
        if: always() && steps.plan.outputs.gefunden == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: guide-entwurf
          path: guide-entwurf/
          if-no-files-found: ignore

      - name: Neuen Guide erkennen
        id: changes
        if: steps.plan.outputs.gefunden == 'true'
        run: |
          if git status --porcelain src/content/articles | grep -q .; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Kein Guide entstanden (Faktentor oder Validierung haben abgelehnt)."
          fi

      - name: Build-Prüfung (nichts Kaputtes veröffentlichen)
        if: steps.changes.outputs.new == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://yvsrquekxnumvmgmjfpy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_hYuXxyx4p_uMMKLFpUu2JQ_lE2mlREG
        run: npm run build

      - name: Änderungen committen und pushen
        if: steps.changes.outputs.new == 'true'
        run: |
          git config user.name "RoP Guide-Automatik"
          git config user.email "actions@github.com"
          git add src/content/articles src/lib/articles.generated.ts
          if [ -d public/images/articles ]; then git add public/images/articles; fi
          if git diff --cached --quiet; then
            echo "Nichts zu committen."
            exit 0
          fi
          git commit -m "Guide: Übersicht zu ${{ steps.plan.outputs.name }} ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase --autostash origin main
          git push origin main

      # Damit ein grüner Lauf ohne Guide nicht wie ein Erfolg aussieht.
      - name: Ergebnis zusammenfassen
        if: always()
        run: |
          if [ "${{ steps.plan.outputs.gefunden }}" != "true" ]; then
            echo "### Guide-Automatik: kein Thema reif" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.changes.outputs.new }}" = "true" ]; then
            echo "### Guide veröffentlicht: ${{ steps.plan.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Kein Guide: Faktentor oder Validierung haben abgelehnt" >> "$GITHUB_STEP_SUMMARY"
            echo "Thema war **${{ steps.plan.outputs.name }}**. Der Entwurf hängt als Download am Lauf." >> "$GITHUB_STEP_SUMMARY"
          fi
